name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 📂 Sync Theme
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          
          # SOURCE: We take the specific theme folder from your repo
          # (No trailing slash = treat as a folder object)
          local_path: 'wp-content/themes/20storieshigh'
          
          # DESTINATION: We put it INTO the 'themes' directory on the server
          # (Trailing slash = put it INSIDE this directory)
          remote_path: '/vhosts/20storieshigh.madeatsource.co.uk/htdocs/wp-content/themes/'
          
          # ARGUMENTS:
          # -vvv: Verbose logging (so we can see what's happening)
          # StrictHostKeyChecking=no: Don't fail on first connect
          args: '-vvv -o ConnectTimeout=5 -o StrictHostKeyChecking=no'
